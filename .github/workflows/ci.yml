name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-kernel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: validate-kernel-contract
        run: python tools/ci_gate.py validate-kernel-contract

  validate-mission-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: validate-mission-regression
        run: python tools/ci_gate.py validate-mission-regression

  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: validate-governance
        run: python tools/ci_gate.py validate-governance

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit-tests
        run: python tools/ci_gate.py unit-tests
